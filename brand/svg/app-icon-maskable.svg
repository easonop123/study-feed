<!-- Maskable app icon. Same mark and ground as app-icon.svg, scaled to 0.86
     about the centre so every stroke sits inside Android's safe zone (the
     centre 80% circle, radius 40 of 100). Unscaled, the mark's outer tips reach
     radius 44.06 and a circular mask cuts through them. The ground must stay
     full-bleed: the launcher crops the square, it does not letterbox it. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#141024"/>
  <g transform="translate(50,50) scale(0.86) translate(-50,-50)"
     fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="8.5">
    <path d="M50 12 L86 33 L50 54 L14 33 Z" stroke="#7C5CFF"/>
    <path d="M14 49 L50 70 L86 49" stroke="#FFFFFF"/>
    <path d="M14 65 L50 86 L86 65" stroke="#FFFFFF"/>
  </g>
</svg>
